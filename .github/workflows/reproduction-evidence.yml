name: Reproduction evidence (CPU, network metadata only)

# Collects first-hand evidence for docs/reproduction/: thesis artefact identifiers
# (Zenodo DOIs, GitHub repositories), MADAR primary documentation, and Arabic
# Wikisource page metadata at the pinned revisions of data/corpora/classical_arabic.
# No dataset contents are downloaded except the already-committed public Wikisource
# pages, which are re-parsed at their pinned revisions to verify the frozen text.
# No GPU, no Kaggle, no training.

on:
  push:
    branches: [claude/ansg-original-reproduction]
    paths:
      - 'scripts/reproduction/collect_external_evidence.py'
      - '.github/workflows/reproduction-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reproduction-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (stdlib collector + original corpus builder parser + PDF text)
        run: python -m pip install -q -e . 'beautifulsoup4==4.13.4' 'pypdf==5.4.0'
      - name: Collect evidence
        run: python scripts/reproduction/collect_external_evidence.py
      - name: Commit evidence (metadata, hashes, spans; no dataset text)
        if: github.ref_type == 'branch' && github.ref_name == 'claude/ansg-original-reproduction'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/external/external_evidence.json data/corpora/classical_arabic/story_segments.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: external artefact, MADAR and Wikisource revision audit (run ${GITHUB_RUN_ID})"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-evidence
          path: |
            evidence/external/
            data/corpora/classical_arabic/story_segments.json
          if-no-files-found: warn
