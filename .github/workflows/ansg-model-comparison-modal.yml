name: ANSG Arabic model comparison (Modal GPU)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/base-model-comparison
    paths:
      - .github/workflows/ansg-model-comparison-modal.yml
      - modal_jobs/model_comparison.py

permissions:
  contents: write

concurrency:
  group: ansg-model-comparison-modal
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal client
        run: python -m pip install --upgrade modal
      - name: Validate Modal credentials are configured
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID or MODAL_TOKEN_SECRET GitHub Actions secret missing"
            exit 1
          fi
          # Format checks only; values are never printed.
          python - <<'PY'
          import os
          for name, prefix in (("MODAL_TOKEN_ID", "ak-"), ("MODAL_TOKEN_SECRET", "as-")):
              v = os.environ[name]
              print(f"{name}: starts_with_{prefix}={v.startswith(prefix)} "
                    f"other_prefix={v.startswith('as-' if prefix == 'ak-' else 'ak-')} "
                    f"length={len(v)} has_whitespace={v != v.strip() or ' ' in v}")
          PY
      - name: Run comparison on Modal
        run: modal run modal_jobs/model_comparison.py
      - name: Commit outputs to a results branch
        if: always()
        run: |
          if [ ! -d modal-model-comparison-output ]; then
            echo "No outputs to commit."
            exit 0
          fi
          BRANCH="results/model-comparison-modal-${{ github.run_id }}"
          DEST="results/model_comparison/modal-${{ github.run_id }}"
          mkdir -p "$DEST"
          cp modal-model-comparison-output/* "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$DEST"
          git commit -m "Modal model comparison outputs from run ${{ github.run_id }}"
          git push origin "$BRANCH"
