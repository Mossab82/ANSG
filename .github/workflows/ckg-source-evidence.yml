name: CKG / CST-Onto source evidence (metadata only)

# Records whether the CKG and CST-Onto locations cited in the dissertation
# resolve, and what public metadata says about them. CPU only; no ontology,
# graph or paper text is downloaded or committed; no training runs.

on:
  push:
    branches: [training/reward-rl-ckg-audit]
    paths:
      - scripts/ckg/collect_ckg_source_metadata.py
      - .github/workflows/ckg-source-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect metadata (stdlib only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ckg/collect_ckg_source_metadata.py --out evidence/ckg/ckg_source_evidence.json
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/ckg/ckg_source_evidence.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Record CKG/CST-Onto source evidence (CI run ${GITHUB_RUN_ID})"
          # A failure inside an && list does not trigger `bash -e`, so success is
          # tracked explicitly and the step fails if every attempt fails.
          pushed=false
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "::warning::evidence push attempt ${attempt}/3 failed"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          if [ "${pushed}" != true ]; then
            echo "::error::could not push CKG source evidence after 3 attempts"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ckg-source-evidence
          path: evidence/ckg/ckg_source_evidence.json
