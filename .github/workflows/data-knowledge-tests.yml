name: Data and knowledge layer (Issue #6)

# Tests the merged data/knowledge infrastructure on the PR head WITHOUT PyTorch.
# The model branch (implementation/ansg-core-2026) is intentionally not involved.

on:
  pull_request:
    branches: [master]
  push:
    branches: [claude/data-knowledge-integration]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit "bash" makes GitHub use `bash -eo pipefail`, so `pytest | tee` cannot mask a failure.
    shell: bash

jobs:
  core-install:
    name: pip install -e .[test] / Python ${{ matrix.python }} (no torch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]   # 3.10 = thesis Ch.5 §5.2.1 major version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: PyTorch must not be installed for the data layer
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"
      - name: Full test suite
        run: |
          mkdir -p evidence
          python -m pytest -p no:cacheprovider -rs 2>&1 | tee evidence/pytest_py${{ matrix.python }}.txt
      - name: Package topology
        run: python tools/check_package_topology.py | tee evidence/topology_py${{ matrix.python }}.txt
      - name: Parameter-audit document is current
        run: python scripts/audit_parameters.py --check
      - name: Ingestion CLI refuses to run without a licensed corpus (expected exit 2)
        run: |
          set +e
          ansg-ingest --config configs/data/nights.yaml
          code=$?
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-knowledge-evidence-py${{ matrix.python }}
          path: evidence/

  optional-extras:
    name: Optional extras (rdflib, scikit-learn) — no skipped tests allowed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,ontology,splits]"
      - name: Full suite; fail if anything is skipped
        run: |
          python -m pytest -p no:cacheprovider -rs 2>&1 | tee pytest_extras.txt
          if grep -Eq "[0-9]+ skipped" pytest_extras.txt; then echo "unexpected skipped tests"; exit 1; fi
