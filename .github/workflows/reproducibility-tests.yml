name: Reproducibility utilities (Issue #12)

on:
  push:
    branches: [chatgpt/reproducibility-tools]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Reproducibility tests
        run: python -m pytest -q tests/test_reproducibility.py
      - name: Full data-layer suite
        run: python -m pytest -q
      - name: Package topology check
        run: python tools/check_package_topology.py
