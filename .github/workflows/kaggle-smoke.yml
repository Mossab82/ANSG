name: Kaggle API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout ANSG
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle six
          python -c 'import six, kaggle; print("Kaggle CLI dependencies available")'
      - name: Verify secret is configured
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Set KAGGLE_API_TOKEN in GitHub Actions repository secrets."
            exit 1
          fi
      - name: Verify Kaggle authentication (read-only)
        run: kaggle kernels list --mine --page-size 5
      - name: Push private smoke kernel and launch run
        run: kaggle kernels push -p kaggle/smoke
      - name: Wait for Kaggle run and verify saved GPU report
        run: python kaggle/smoke/wait_for_result.py
      - name: Publish available logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-smoke-output
          path: kaggle-output/
          if-no-files-found: warn
          retention-days: 7
