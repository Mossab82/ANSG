name: Test ANSG research implementation
on:
  push:
    branches: [implementation/ansg-core-2026]
  pull_request:
    branches: [master]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run unit tests
        run: pytest -q
      - name: Verify reported appendix dimensions
        run: python scripts/validate_spec.py
      - name: Smoke training
        run: python train.py --epochs 1 --output runs/smoke
