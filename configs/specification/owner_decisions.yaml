    variant: ch4_eq_4_26_to_4_29
    R_total: {R_cult: 0.45, R_ling: 0.35, R_coh: 0.20}
    R_cult: {CMPI: 0.35, virtue_coherence: 0.30, rhetorical_devices: 0.25, register: 0.10}
    R_ling: {inverse_perplexity_normalised: 0.40, BLEU: 0.35, BERTScore: 0.25}
    R_coh: {coreference: 0.50, temporal: 0.30, causal: 0.20}
    pages: [115, 116, 117, 118]
  ppo:
    variant: ch5_s5_6_3_table_5_9
    values: {clip_range: 0.20, value_coef: 0.50, entropy_coef: 0.01, gae_lambda: 0.95, rollout_batch: 128, ppo_epochs: 4, minibatch: 32, kl_coef: 0.01, max_grad_norm: 0.5, learning_rate: 1.0e-5}
    pages: [148, 151]
  training_schedule: "configs/specification/training_schedule.yaml#stages"

