# Decisions register for PR #33 (reward/RL, CMPI, CKG/CST-Onto, training).
#
# Sections:
#   decided              the owner's directives (2026-11-14); not re-opened
#   stated_values        values the dissertation states and the decisions adopt
#   conflicts_recorded   other statements in the dissertation, kept, not adopted
#   operational_gaps     missing specifications or inputs; NOT author questions;
#                        not raised again until an implementation is put forward
#   awaiting_previous_decision  already put to the owner; not re-raised

schema: ansg.owner_decisions/1
recorded: "2026-11-14"

decided:
  - id: D1-ansg-cmpi
    directive: "Adopt the dissertation's CMPI definition and weights for ANSG; compute from caller-supplied dimension scores with documented provenance; no invented extraction from text."
    implemented_in: [src/ansg/evaluation/cmpi.py, configs/evaluation/cmpi_variants.yaml]
    weights: {rhetorical_devices: 0.35, dialectal_appropriateness: 0.25, narrative_structure: 0.25, moral_framing: 0.15}
    note: "The definition and weights are in the dissertation (§5.1 p.131; §8.7.4 p.223); a procedure for extracting each dimension score from text is not."
  - id: D2-separate-metrics
    directive: "Keep the CULTURA, CST-Onto and MM-GTA metrics separate from ANSG's CMPI; no conversion or substitution."
    implemented_in: [configs/evaluation/cmpi_variants.yaml, src/ansg/evaluation/cmpi.py]
  - id: D3-cultura-conflict
    directive: "Keep the CULTURA equation and published result as printed; record the conflict and the author's options in one record; do not raise it again until a new decision."
    single_record: "configs/evaluation/cmpi_variants.yaml#cultura (printed_formula_conflicts, conflict_computation, author_decision_options)"
  - id: D4-reward-ppo-no-invention
    directive: "Change no normalisation, KL placement or sub-metric without explicit dissertation support or an owner decision; keep unresolved items documented and blocked."
  - id: D5-resources-rights-training
    directive: "Assume no CKG or CST-Onto files and no permission to use them; keep resources, rights, admission and training execution blocked until files, licences and data are supplied."
    implemented_in: [configs/knowledge/ckg.yaml, configs/specification/training_schedule.yaml]
  - id: D6-reward-reference
    directive: "Use the full §4.5 formula, Eq. 4.26-4.29, as the detailed reference reward; record Table 4.1, Eq. 5.1 and Appendix A.3 formulas as separate conflicts; sub-components that cannot be computed automatically are caller-supplied inputs with provenance."
    implemented_in: ["configs/specification/reward_rl_variants.yaml (selected_variant, selection.reward)"]
  - id: D7-ppo-settings
    directive: "Adopt the §5.6.3 / Table 5.9 PPO values; record Appendix A.3's learning rate 1e-6 as a conflict with the body."
    implemented_in: ["configs/specification/reward_rl_variants.yaml (selected_ppo_variant, selection.ppo)", "ansg.reward_spec.RewardSpec.selected_ppo_kwargs"]
  - id: D8-normalisation-kl
    directive: "Invent no normalisation rule: record it as a required input. Record KL placement as an implementation choice to pin before training. Do not raise either again unless an implementation is put forward for approval."
    implemented_in: ["configs/specification/reward_rl_variants.yaml#operational_gaps"]
  - id: D9-sub-metrics
    directive: "Use the §4.5 printed weights and equations as they are; keep automatic computation blocked for components whose text measurement the dissertation does not specify (virtue coherence, coreference, temporal, causal, ...). This is a specification gap or evaluation input, not an author decision."
  - id: D10-training-schedule
    directive: "Document the §5.6 schedule (supervised 1-30 on full ANHC 70.4M + 23M annotated; adversarial 31-65 with 50K generated samples per epoch + ANHC samples; PPO 66-100 on-policy with 128-story batches); keep execution blocked until data and rights are available."
    implemented_in: [configs/specification/training_schedule.yaml]

stated_values:
