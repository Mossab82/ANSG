  # ---------------------------------------------------------------- MADAR as described in the thesis vs official documentation
  - id: MADAR-VARIETIES
    ref: "Table §3.1.5, p. 55 ('26 cities') vs official MADAR page and LREC 2018 paper (evidence/external)"
    claim: "26 cities"
    inputs: {cities: 25, msa: 1}
    formula: "cities"
    reported: 26
    tolerance: 0
    note: "official: 25 city dialects + MSA; 'Corpus-26' counts the 26 varieties, not 26 cities"
  - id: MADAR-SIZE-WORDS-ESTIMATE
    ref: "Table §3.1.5, p. 55 ('2.1M') vs official sizes"
    claim: "MADAR = 2.1M (unit not stated by the thesis)"
    inputs: {c26_sentences: 2000, c26_varieties: 26, c6_extra_sentences: 10000, c6_varieties: 6, words_per_sentence: 6.5}
    formula: "(c26_sentences*c26_varieties + c6_extra_sentences*c6_varieties) * words_per_sentence / 1e6"
    reported: 2.1
    tolerance: 0.05
    note: "estimate of total Arabic words in Corpus-26 + Corpus-6 using the paper's 6.5 words/sentence (BTEC average); no official source for '2.1M' was found"
