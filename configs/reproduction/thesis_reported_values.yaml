  - {id: T3.2-CLASSICAL-PCT, ref: "Table 3.2, p. 56", claim: "classical 35.0%", inputs: {c: 24.6, t: 70.4}, formula: "100*c/t", reported: 35.0, tolerance: 0.05, note: "rounding-level only (34.94); the three shares sum to 100.1"}
  - {id: T3.3-TOKENS-SUM, ref: "Table 3.3, p. 56", claim: "70.4M total", inputs: {a: 28.7, b: 22.8, c: 10.2, d: 5.1, e: 3.6}, formula: "a+b+c+d+e", reported: 70.4, tolerance: 0.05}
