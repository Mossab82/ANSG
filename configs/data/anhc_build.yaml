# Construction policy for the new ANHC corpus. This is not an annotation file
# and does not mark any source as training-cleared by itself.
schema: ansg.anhc_build/0.1
dataset_id: ANHC-reconstruction
dataset_status: populated_staging_review_required
historical_dataset_claim: false
training_ready: false

target_reference:
  thesis_total_tokens: 70400000
  thesis_annotated_tokens: 23000000
  note: "Reference values only; never report as current corpus counts."
  desired_varieties: [MSA, Egyptian, Levantine, Gulf, Maghrebi]
  desired_split: {train: 0.8, validation: 0.1, test: 0.1}
  split_seed_reference: 42

record_contract:
  schema_version: ansg.anhc-record/0.1
  required_source_fields:
    - source_id
    - source_url
    - source_revision
    - source_file_sha256
    - edition
    - copyright_status
    - license
    - redistributable
  required_narrative_fields:
    - record_id
    - parent_story_id
    - nesting_level
    - title
    - source_span
    - split
  annotation_layers:
    dia: {status: [unannotated, automatic, silver, gold]}
    motif: {status: [unannotated, automatic, silver, gold]}
    moral: {status: [unannotated, automatic, silver, gold]}
  gold_rule: "human adjudication under a versioned guide; model output never counts as gold"
  split_rule: "keep parent-child tales, parallel retellings, and duplicate source cycles in one split"

current_seed:
  path: data/corpora/classical_arabic/index.json
  records: 20
  words: 195197
  record_unit: source_page_or_cycle
  rights_cleared_for_training: false
  nested_stories_segmented: false
  annotations_present: false
  split_status: unassigned
  staging_output:
    records_path: data/corpora/anhc/staging_records.jsonl
    review_queue_path: data/corpora/anhc/story_review_queue.jsonl
    manifest_path: data/corpora/anhc/manifest.json
    validation_report_path: data/corpora/anhc/validation_report.json
    source_intake_report_path: data/corpora/anhc/source_intake.json
    records: 27
    nights_candidate_segments: 12
    kalila_titled_page_candidates: 15
    schema_errors: 0
    schema_warnings: 27
    annotation_status: {dia: unannotated, motif: unannotated, moral: unannotated}
    rights_cleared_for_training: false
    split_status: unassigned

  sources:
    - source_family: arabian_nights
      ids: [arabian_nights-001, arabian_nights-002, arabian_nights-003, arabian_nights-004, arabian_nights-005]
      rights_status: revision_review_required
      notes:
        - "Part 1 Hindawi 2022 page states original-work text is public domain; cover/design is separately CC BY 4.0."
        - "Verify the exact source revision for each collected page; retain only permitted text and attribution."
    - source_family: kalila_dimna
      ids: [kalila_dimna-006, kalila_dimna-007, kalila_dimna-008, kalila_dimna-009, kalila_dimna-010, kalila_dimna-011, kalila_dimna-012, kalila_dimna-013, kalila_dimna-014, kalila_dimna-015, kalila_dimna-016, kalila_dimna-017, kalila_dimna-018, kalila_dimna-019, kalila_dimna-020]
      rights_status: edition_mapping_required
      notes:
        - "Wikisource scan of the Egypt 1355 AH edition is marked public domain."
        - "Map each story page to the exact scanned edition/revision before training use."

user_supplied_source_files:
  - work: alf_layla_wa_layla
    pages: 1342
    intake_status: scanned_images_arabic_ocr_required
    bibliographic_edition_identified: false
    rights_status: unknown_review_required
  - work: kalila_wa_dimna
    pages: 101
    intake_status: searchable_arabic_with_glyph_review_required
    contents_entries: 19
    current_seed_title_matches: 15
    additional_front_matter_candidates: 4
    rights_status: unknown_review_required
narrative_source_registry: data/sources/narrative_registry.json
external_candidates:
  - id: arastories
    url: https://github.com/UBC-NLP/arastories
    varieties: [MSA, Egyptian, Maghrebi]
    content_types: [stories, prompts]
    origins_reported: [machine_translated, model_generated]
    repository_license: MIT
    admission_status: per_record_provenance_and_rights_review
    use_before_review: none
    note: "Repository license and dataset origins are recorded separately; do not infer per-story rights from MIT alone."
  - id: arabic_stories_corpus
    url: https://github.com/motazsaad/Arabic-Stories-Corpus
    varieties: [MSA]
    content_types: [short_stories]
    repository_license: Apache-2.0
    admission_status: underlying_source_rights_review
    use_before_review: none
    note: "Reported source websites include Mawdoo3 and Qisasse; repository license does not settle all underlying rights."
  - id: shami
    url: null
    varieties: [Levantine]
    content_types: [short_conversational_sentences]
    admission_status: source_and_license_verification
    use_before_review: dialect_reference_only
    note: "Not long-form stories; do not import as narrative examples."
  - id: qcri_dialectal_arabic_resources
    url: https://alt.qcri.org/resources/da_resources/
    source_repository: https://github.com/qcri/dialectal_arabic_resources
    varieties: [Egyptian, Levantine, Gulf, Maghrebi]
    content_types: [tweets, segmentation_labels, pos_tags]
    reported_size: "350 manually segmented and POS-tagged tweets per dialect in the four-dialect POS resource; segmentation training resources are separate"
    provider_license: Apache-2.0
    admission_status: auxiliary_task_specific_resource
    use_before_review: morphological_segmentation_and_pos_auxiliary_only
    excluded_from: [narrative_story_training, ANHC_story_counts]
    note: "QCRI explicitly lists the resource license; preserve source citation and separate splits."
  - id: arabic_verbnet
    url: https://github.com/JaouadMousser/Arabic-Verbnet
    varieties: [Arabic_unspecified]
    content_types: [verb_lexicon, syntactic_alternations, semantic_roles, example_sentences]
    license_status: not_verified
    admission_status: license_and_schema_review_required
    use_before_review: none
    candidate_role: lexical_semantic_reference_for_morphology_and_CKG
    excluded_from: [narrative_story_training, dialect_gold_labels]
    note: "Repository XML includes verb members, roots, argument structures, semantic predicates, and examples; no license was evident on the repository landing page."
  - id: arabic_dialect_identification_repository
    url: https://github.com/Lafifi-24/arabic-dialect-identification
    varieties: [MSA, Egyptian, Levantine, Gulf, Maghrebi, other_country_dialects]
    content_types: [dialect_labeled_sentences, classifier_code, pretrained_models]
    origins_reported: [arabic_pos_dialect, IADD, QADI, MADAR, Wikipedia_MSA]
    repository_license_status: not_verified
    admission_status: provenance_and_license_review_required
    use_before_review: classifier_baseline_reference_only
    excluded_from: [narrative_story_training, ANHC_gold_labels]
    note: "Aggregates sources and sentence-level dialect labels; do not import its mixed dataset as narrative examples or reuse benchmark tests for training."
  - id: sanaa_ai_dialect_stories
    url: https://www.sanaa.ai/stories/index.php/
    varieties_observed: [Palestinian-Jordanian, Palestinian, Yemeni, Moroccan]
    content_types: [short_modern_dialect_stories, proverb_explanations]
    displayed_window: "rolling selection of 200 stories, 20 per page"
    authorship_and_generation_provenance: unknown
    license_status: no_reuse_license_found_on_reviewed_story_pages
    admission_status: permission_and_provenance_review_required
    use_before_review: metadata_reference_only
    candidate_role: dialect_story_discovery_and_human_review_candidate
    excluded_from: [ANHC_text_ingestion, gold_annotations, training]
    note: "Do not scrape or copy story text until rights and authorship are established; observed dialect tags are site-provided labels, not adjudicated gold."
  - id: wojood_arabic_nested_ner
    url: https://github.com/SinaLab/ArabicNER
    model_url: https://huggingface.co/SinaLab/ArabicNER-Wojood
    varieties: [MSA, Arabic_dialects_unspecified_in_summary]
    content_types: [nested_named_entity_annotations, NER_code, NER_model]
    corpus_reference: {tokens: 550000, entity_types: 21, entities: 75000, nested_entity_share: 0.225}
    code_license: MIT
    full_corpus_access: available_on_request_for_academic_and_commercial_use
    admission_status: NER_component_candidate_corpus_access_review_required
    use_before_review: model_or_demo_assessment_only
    candidate_role: character_location_and_entity_consistency_diagnostics
    excluded_from: [narrative_story_training, ANHC_gold_annotations]
    note: "README-reported figures; request full corpus/guidelines from provider before using labels as gold. Verify pretrained model terms separately."

merged_available_source_snapshot:
  manifest: data/corpora/anhc/merged_candidate_manifest.json
  merge_script: scripts/merge_anhc_available_sources.py
  narrative_records: 42
  source_family_groups: 20
  kalila_pdf_parallel_candidates: 15
  kalila_title_links: 15
  non_narrative_pdf_front_matter_units: 4
  whitespace_word_instances_including_parallel_versions: 227869
  exact_text_duplicates: 0
  story_review_queue_rows: 42
  external_dialect_story_sources_downloaded: false
  training_ready: false
  rights_cleared: false
  split_status: unassigned
  annotations: {dia: unannotated, motif: unannotated, moral: unannotated}
  note: "Local quarantine text includes rights-unresolved PDF material; counts include parallel versions and are not tokenizer-specific or unique-story counts."

build_gates:
  - source_revision_and_rights_verified
  - narrative_units_and_parent_links_reviewed
  - duplicated_or_parallel_story_families_grouped
  - annotation_guide_versioned
  - gold_labels_human_adjudicated
  - leakage_safe_splits_frozen
  - token_counts_computed_with_selected_tokenizer
