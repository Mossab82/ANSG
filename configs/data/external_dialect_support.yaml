schema: ansg.external_dialect_support/1
purpose: >
  Track external dialect resources for auxiliary evaluation and dialect-identifier
  research. These are not narrative additions to ANHC and their records do not
  contribute to the 72M story-corpus scope or the 23M triple-annotation target.
sources:
  - source_id: madar_parallel_corpus
    title: MADAR Arabic Parallel Corpus
    official_url: https://camel.abudhabi.nyu.edu/madar-parallel-corpus/
    role: external_dialect_evaluation_only
    coverage: 25 city dialects plus MSA; includes Amman and Salt
    source_domain: translated Basic Traveling Expression Corpus travel sentences
    releases:
      corpus_26: 2000 seed sentences translated across the 25 city dialects plus MSA
      corpus_6: 12000 sentences across five selected city dialects plus MSA
    permitted_use: internal research and evaluation only
    restrictions: [do_not_modify_dataset, do_not_redistribute, do_not_sublicense]
    acquisition: official download form; do not submit on behalf of user
    data_status: not_downloaded
    story_corpus_admission: excluded_not_narrative
    planned_use: evaluate DIA proxy/classifier; never count as long-form narrative

  - source_id: shami_corpus
    title: Shami: A Corpus of Levantine Arabic Dialects
    official_url: https://huggingface.co/datasets/arbml/Shami
    paper_url: https://aclanthology.org/L18-1576/
    reported_paper_volume: 117805
    observed_huggingface_rows: 66251
    dialects: [Jordanian, Palestinian, Syrian, Lebanese]
    domain: social_media
    role: dialect_classifier_support_after_rights_review
    redistribution_status: unresolved_upstream_text_rights
    data_status: not_in_current_release
    story_corpus_admission: excluded_not_narrative

  - source_id: qadi
    title: QCRI Arabic Dialect Identification
    official_url: https://github.com/qcri/QADI
    reported_volume: 540590
    dialects: 18_country_labels
    domain: tweets; repository provides tweet IDs requiring hydration
    role: dialect_identification_only
    access_and_redistribution: external_platform_terms_and_text_rights_review_required
    data_status: not_hydrated
    story_corpus_admission: excluded_not_narrative

  - source_id: nadi_2023
    title: Nuanced Arabic Dialect Identification Shared Task
    official_url: https://nadi.dlnlp.ai/2023/
    reported_volume: 23400
    domain: tweets; shared-task data access is registered
    role: dialect_identification_only
    access_and_redistribution: registration_and_license_terms_required
    data_status: not_downloaded
    story_corpus_admission: excluded_not_narrative

  - source_id: dart
    title: Dialectal Arabic Tweets
    official_url: https://aclanthology.org/L18-1579/
    reported_volume: about_25000_tweets
    dialects: [Egyptian, Maghrebi, Levantine, Gulf, Iraqi]
    domain: crowdsourced_twitter_text
    role: dialect_classification_benchmark_only
    redistribution_status: license_review_required
    data_status: not_downloaded
    story_corpus_admission: excluded_not_narrative

counting_rule:
  include_in_ANHC_story_token_total: false
  include_in_DIA_MOTIF_MORAL_adjudicated_coverage: false
  include_only_as_external_DIA_evaluation_if_access_and_license_allow: true
