release_rules:
  - describe_ANHC_novelty_as_integrated_source_annotation_architecture_design
  - retain_MADAR_as_a_documented_dialect_component_without_counting_travel_sentences_as_stories
  - describe_CAMeL_as_processing_support_not_a_text_corpus
  - do_not_merge_provider_token_counts_with_local_tokenizer_counts
  - do_not_count_machine_suggested_labels_as_human_adjudicated_coverage
  - preserve_source_cycle_grouping_before_train_validation_test_split
  - do_not_claim_23m_triple_annotated_tokens_until_adjudicated_span_coverage_is_audited
