    role: open_full_scale_source_pool_and_narrative_candidates
    source_url: https://doi.org/10.5878/7rbh-gy93
    license: CC-BY-4.0
    source_size: 1745_books
    provider_native_statistics:
      tokens: 76486597
      sentences: 3629107
      snapshot: 2025-09-12
      provider: Sprakbanken_Text
    local_direct_profile:
      all_books_sentencepiece_tokens: 107029217
      unique_narrative_candidate_sentencepiece_tokens: 82705621
      whitespace_words_all_books: 66081654
      tokenizer_model_sha256: 7744212cab83605e2726796fc87930a8f58b9c6a765529e541bce4bbea9792ba
    limitations:
      - provider_native_tokens_and_local_sentencepiece_pieces_are_different_counters
