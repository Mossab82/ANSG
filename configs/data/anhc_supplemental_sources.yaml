schema: ansg.anhc_supplemental_sources/2
purpose: >-
  Trace the thesis's novelty as a deliberate integration of narrative source
  families, Arabic dialect resources, CAMeL-based processing, three annotation
  layers, and ANSG architectural supervision. This provenance map distinguishes
  thesis-reported ingredients from locally verified files and licensed intake.
novelty_claim_from_thesis:
  source: Tesis_Ibrahim.pdf, Chapter 3, §§3.1.5-3.2 and Appendix A.20
  thesis_definition: >-
    ANHC novelty is the combination of approximately 70.4M tokens, narrative
    focus, five-way dialect coverage, DIA/MOTIF/MORAL annotation, and explicit
    coupling to CSAM, DAL, and culturally-grounded RL.
  integration_dimensions:
    - multiple_classical_modern_contemporary_narrative_families
    - dialectal_resources_and_five_variety_stratification
    - CAMeL-assisted morphological analysis and root-aware tokenization
    - tri-layer DIA_MOTIF_MORAL annotations
    - source-aligned supervision for CSAM_DAL_RL
  note: >-
    MADAR is a dialectal resource and CAMeL Tools is a processing toolkit.
    They are not interchangeable with long-form story collections; the novelty
    is the designed integration, not treating every resource as narrative text.

thesis_reported_source_composition:
  classical_pre_1800:
    tokens: 24600000
    segments: 296000
    named_families:
      - Alf Layla wa-Layla: 8200000 tokens, Mahdi critical edition
      - Kalila wa-Dimna: 3100000 tokens
      - classical_adab: 13300000 tokens, including Maqamat al-Hariri, Kitab al-Aghani, and al-Jahiz works
    source_files_in_direct_build: partial_different_editions
  modern_1800_2000:
    tokens: 18300000
    segments: 224000
    named_families: [Naguib Mahfouz, Taha Hussein, canonical adab]
    source_files_in_direct_build: not_verified; copyright_and_edition_review_required
  contemporary_post_2000:
    tokens: 27500000
    segments: 327000
    named_families: [blogs, transcribed_oral_tales, regional_collections]
    source_files_in_direct_build: partial; user_provided_shami_lines_are_not_story_verified
  dialect_distribution_reported_in_table_3_3:
    MSA: 28700000
    Egyptian: 22800000
    Levantine: 10200000
    Gulf: 5100000
    Maghrebi: 3600000
  thesis_targets:
    total_tokens: 70404829
    triple_annotated_tokens: 23000000
    segments: 847000
    narrative_units_appendix_A_17: 55600
  caveat: >-
    Preserve all thesis-reported values as targets. Other thesis sections
    report conflicting dialect percentages, narrative counts, tokenization
    details, and split populations; see the release protocol conflict register.

processing_tools:
  - tool_id: camel_tools
    title: CAMeL Tools
    official_url: https://camel-tools.readthedocs.io/
    thesis_role: morphology_analysis_for_root_aware_tokenization_and_dialect_preservation
    reported_version: 1.5.2
    reported_databases: [calima-msa-s31, calima-egy-s31]
    fallback: MSA_analysis_plus_dialect_lexicon_extensions_for_other_dialects
    contributes_source_text: false
    direct_build_status: not_yet_reproduced; root-aware original tokenizer artifact unavailable

