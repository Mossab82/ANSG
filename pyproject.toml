[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ansg"
version = "0.1.0.dev0"
description = "ANSG: Automated Arabic Narrative Story Generation — research implementation (data/knowledge layer + PyTorch CSAM/DAL model)"
readme = "README.md"
requires-python = ">=3.10"
# The data/knowledge layer must stay importable without PyTorch (Issue #6/#11);
# model code and its runtime dependencies are in the `model` extra.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# Model, training and generation (formerly core dependencies of ansg-research).
# Exact versions must follow the reconciled thesis environment (C-ENV-1).
model = ["torch>=2.1", "numpy>=1.24"]
# Optional Hugging Face backbone bridge (ansg.pretrained.PretrainedANSG.from_pretrained).
pretrained = ["transformers>=4.40"]
# BLEU/ROUGE helpers in ansg.evaluation.basic_metrics.
metrics = ["sacrebleu>=2.4", "rouge-score>=0.1.2"]
ontology = ["rdflib>=7.0"]
splits = ["scikit-learn>=1.2"]
# Historical scripts at the repository root (not used by src/ansg). Listed for provenance only.
legacy = [
    "mysql-connector-python", "nltk", "pyarabic", "tashaphyne", "polyglot",
    "wikipedia-api", "scikit-learn", "pandas", "textblob", "rake-nltk", "requests",
]

[project.scripts]
ansg-ingest = "ansg.data.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests over fixture files",
    "model: requires the `model` extra (PyTorch); skipped when it is not installed",
]
